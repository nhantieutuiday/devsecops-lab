name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/^v//')
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: ./gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif --exit-code 1 --redact

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

      - name: Gate on secrets found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected one or more secrets - failing the build."
          exit 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config .semgrep/rules.yml \
            --sarif --output semgrep-report.sarif \
            --error \
            ./app

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif
          category: semgrep

      - name: Gate on findings
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep found high-confidence issues - failing the build."
          exit 1

  sca:
    name: SCA (Dependency Scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies (generates package-lock.json)
        run: npm install
        working-directory: app

      - name: Install OSV-Scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: Run OSV-Scanner
        id: osv
        continue-on-error: true
        run: ./osv-scanner --format=sarif --output=osv-report.sarif --lockfile=app/package-lock.json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-report.sarif
          category: osv-scanner

      - name: Gate on vulnerabilities found
        if: steps.osv.outcome == 'failure'
        run: |
          echo "OSV-Scanner found known vulnerabilities in dependencies - failing the build."
          exit 1
